<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – StayOS Hotel Review Management</title>
  <meta name="description" content="Create your free StayOS account and start managing your hotel reviews, collecting guest feedback and improving your online reputation.">
  <!-- Open Graph -->
  <!-- Twitter -->

  <link rel="stylesheet" href="style.css">
  <!-- GA4 (fires only when real ID is set in js/app.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body class="su-body">

  <div class="su-wrap">
    <header class="su-top">
      <a href="index.html" class="logo" aria-label="StayOS home">
        <img src="images/stayoslogo.png" alt="StayOS - One Platform, Endless Possibilities" class="logo-img" />
      </a>
      <a href="index.html" class="su-exit">Save and exit</a>
    </header>

    <div class="su-progress">
      <p class="su-step-label">Step 1 of 2</p>
      <div class="su-bars" aria-hidden="true">
        <span class="on"></span>
        <span></span>
      </div>
    </div>
    <main>
      <h1>Let's set up your hotel</h1>
      <p class="su-sub">Takes less than a minute. No card needed.</p>

      <div id="signup-error" class="form-error" role="alert" style="display:none;"></div>

      <form id="signupForm" novalidate>
        <div class="su-row">
          <div class="form-group">
            <label for="name">Your name</label>
            <input type="text" id="name" name="name" autocomplete="name" />
            <p class="field-error" id="nameError"></p>
          </div>
          <div class="form-group">
            <label for="hotelName">Hotel name</label>
            <input type="text" id="hotelName" name="hotelName" autocomplete="organization" />
            <p class="field-error" id="hotelNameError"></p>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" />
          <p class="field-error" id="emailError"></p>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" />
          <p class="field-error" id="passwordError"></p>
          <p class="su-hint">At least 8 characters</p>
        </div>

        <button type="submit" class="btn btn-block btn-primary su-btn">Continue</button>
      </form>

      <p class="form-footer" style="margin-top: 24px; text-align: center; color: var(--muted); font-size: 14px;">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Log in</a>
      </p>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
