<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Setup – StayOS</title>

  <link rel="stylesheet" href="style.css" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body class="su-body">

  <div class="su-wrap">
    <header class="su-top">
      <a href="index.html" class="logo" aria-label="StayOS home">
        <img src="images/stayoslogo.png" alt="StayOS logo" class="logo-img" />
      </a>
      <a href="index.html" class="su-exit">Save and exit</a>
    </header>

    <div class="su-progress">
      <p class="su-step-label">Step 2 of 2</p>
      <div class="su-bars" aria-hidden="true">
        <span class="on"></span>
        <span class="on"></span>
      </div>
    </div>

    <main>
      <h1>Hotel Details</h1>
      <p class="su-sub">Tell us a bit more about your property so we can tailor StayOS for you.</p>

      <form action="questionnaire.html" id="setupForm" novalidate>

        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input type="tel" id="contact" name="contact" autocomplete="tel" required placeholder="+91 98765 43210" />
        </div>

        <div class="form-group">
          <label for="location">Exact Location</label>
          <input type="text" id="location" name="location" autocomplete="street-address" required placeholder="123 Hotel St, City, Country" />
        </div>

        <div class="form-group">
          <label for="chainType">Property Type</label>
          <select id="chainType" name="chainType" class="su-select" required style="width: 100%; padding: 14px 16px; font-family: var(--font-body); font-size: 16px; background: var(--bg); border: 1px solid var(--border-color); border-radius: 0;">
            <option value="" disabled selected>Select an option</option>
            <option value="independent">Independent Hotel / Boutique</option>
            <option value="chain">Part of a Hotel Chain</option>
            <option value="resort">Resort / Villa</option>
          </select>
        </div>

        <div class="form-group" style="margin-top:16px;">
          <label for="rooms">Number of Rooms</label>
          <input type="number" id="rooms" name="rooms" min="1" required placeholder="e.g. 50" />
        </div>

        <button type="submit" class="btn btn-block btn-primary su-btn">Complete Setup</button>
      </form>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById('setupForm').addEventListener('submit', function(e) {

      e.preventDefault();
      window.location.href = 'questionnaire.html';
    });
  </script>
</body>
</html>
