<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – StayOS Hotel Review Management</title>
  <meta name="description"
    content="Log in to your StayOS account to manage your hotel reviews, reply to guests and track your online reputation.">
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>

<body class="su-body">
  <div class="su-wrap">
    <header class="su-top">
      <a href="index.html" class="logo" aria-label="StayOS home">
        <img src="images/stayoslogo.png" alt="StayOS logo" class="logo-img" />
      </a>
      <a href="signup.html" class="su-exit" style="color: var(--primary);">Sign up free</a>
    </header>

    <main>
      <h1>Welcome back</h1>
      <p class="su-sub">Log in to your StayOS account to continue managing your hotel's reputation.</p>

      <div id="login-error" class="form-error" role="alert" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" name="email" autocomplete="email" required placeholder="jane@yourhotel.com">
        </div>

        <div class="form-group" style="margin-top:16px;">
          <label for="li-password">Password</label>
          <input type="password" id="li-password" name="password" autocomplete="current-password" required
            placeholder="Your password">
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block su-btn" style="margin-top: 24px;">
          Log In
        </button>
      </form>

      <p class="form-footer" style="margin-top: 24px; text-align: center; color: var(--muted); font-size: 14px;">
        Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 600;">Sign up free</a>
      </p>
    </main>
  </div>

  <script src="js/app.js" defer></script>
</body>

</html>
